name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Zero-DCE model (Apache-2.0)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 5 --retry-delay 3 -o app/src/main/assets/zerodce_512.tflite \
            https://huggingface.co/mlboydaisuke/zero-dce-litert/resolve/main/zerodce_512.tflite
          test -s app/src/main/assets/zerodce_512.tflite

      - name: Download Real-ESRGAN General x4v3 model (BSD-3-Clause)
        run: |
          set +e
          mkdir -p /tmp/esrgan app/src/main/assets
          curl -fL --retry 5 --retry-delay 3 -o /tmp/esrgan/model.zip \
            "https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/real_esrgan_general_x4v3/releases/v0.63.0/real_esrgan_general_x4v3-tflite-float.zip"
          unzip -o /tmp/esrgan/model.zip -d /tmp/esrgan/unzipped
          echo "--- archive contents ---"
          find /tmp/esrgan/unzipped -type f -exec ls -l {} \;
          MODEL=$(find /tmp/esrgan/unzipped -name '*.tflite' -type f | head -n 1)
          if [ -n "$MODEL" ]; then
            cp "$MODEL" app/src/main/assets/realesrgan_x4v3.tflite
            echo "Installed $MODEL"
          else
            echo "WARNING: no .tflite found, Max mode detail pass will be unavailable"
          fi
          echo "--- assets ---"
          ls -l app/src/main/assets

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
