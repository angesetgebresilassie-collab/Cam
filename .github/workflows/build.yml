name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Zero-DCE model (Apache-2.0)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/zerodce_512.tflite \
            https://huggingface.co/mlboydaisuke/zero-dce-litert/resolve/main/zerodce_512.tflite
          test -s app/src/main/assets/zerodce_512.tflite

      - name: Download Real-ESRGAN General x4v3 model (BSD-3-Clause)
        run: |
          curl -fL -o app/src/main/assets/realesrgan_x4v3.tflite \
            https://huggingface.co/qualcomm/Real-ESRGAN-General-x4v3/resolve/main/Real-ESRGAN-General-x4v3.tflite \
            || rm -f app/src/main/assets/realesrgan_x4v3.tflite
          ls -l app/src/main/assets

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
