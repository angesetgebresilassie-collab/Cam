name: Build Galaxy AI Camera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract zip archive
        run: |
          echo "Locating galaxy-ai-camera.zip..."
          ZIP_PATH=$(find . -name "galaxy-ai-camera.zip" | head -n 1)
          
          if [ -z "$ZIP_PATH" ]; then
            echo "Error: galaxy-ai-camera.zip was not found in the repository!"
            exit 1
          fi
          
          echo "Extracting $ZIP_PATH..."
          unzip -q "$ZIP_PATH" -d source-folder
          
          BUILD_FILE=$(find source-folder -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle or build.gradle.kts found inside the unzipped archive!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project root at: $PROJECT_DIR"

      - name: Force Upgrade Gradle Wrapper to 8.5
        run: |
          cd "$PROJECT_DIR"
          
          # Create wrapper directory structure
          mkdir -p gradle/wrapper
          
          # Force distribution URL to Gradle 8.5 (Java 17 compatible)
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Download official wrapper launcher files directly
          curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew" -o gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-ai-camera-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
