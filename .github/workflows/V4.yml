name: Build Galaxy AI Camera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up JDK 8 (Matches legacy Gradle 4.4.1)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # Locate and extract galaxy-ai-camera.zip
      - name: Extract zip archive
        run: |
          echo "Locating galaxy-ai-camera.zip..."
          ZIP_PATH=$(find . -name "galaxy-ai-camera.zip" | head -n 1)
          
          if [ -z "$ZIP_PATH" ]; then
            echo "Error: galaxy-ai-camera.zip was not found in the repository!"
            exit 1
          fi
          
          echo "Extracting $ZIP_PATH..."
          unzip -q "$ZIP_PATH" -d source-folder
          
          BUILD_FILE=$(find source-folder -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle or build.gradle.kts found inside the unzipped archive!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project root at: $PROJECT_DIR"

      # Make sure gradlew script is executable
      - name: Prepare Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Error: gradlew executable is missing from project!"
            exit 1
          fi

      # Build Debug APK using native project wrapper
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # Upload generated APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-ai-camera-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
