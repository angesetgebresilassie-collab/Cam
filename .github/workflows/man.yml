name: Build Galaxy AI Camera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Extract zip archive
        run: |
          echo "Extracting galaxy-ai-camera.zip..."
          unzip -q galaxy-ai-camera.zip -d source-folder
          
          # Find the directory containing build.gradle or build.gradle.kts
          BUILD_FILE=$(find source-folder -maxdepth 2 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle or build.gradle.kts found in the unzipped files!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project root at: $PROJECT_DIR"

      - name: Ensure Gradle Wrapper Exists
        run: |
          cd "$PROJECT_DIR"
          
          if [ -f "gradlew" ]; then
            echo "Gradle wrapper found!"
            chmod +x gradlew
          else
            echo "No gradlew found. Installing system Gradle and initializing wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-ai-camera-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
